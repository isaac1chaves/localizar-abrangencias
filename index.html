<script>
(function () {
  try {
    var html = document.documentElement;
    var mem = navigator.deviceMemory || 8;          // GB estimado
    var cores = navigator.hardwareConcurrency || 8; // núcleos lógicos
    var saveData = navigator.connection && navigator.connection.saveData;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var low = (mem <= 4) || (cores <= 4) || !!saveData || !!reduceMotion;
    // Override manual: localStorage 'perf_lite' = '1' (força) ou '0' (desliga)
    var forced = null;
    try { forced = localStorage.getItem('perf_lite'); } catch (e) {}
    if (forced === '1') low = true;
    if (forced === '0') low = false;
    if (low) html.classList.add('perf-lite');
  } catch (e) {}
})();
</script>

.report-bugs{
  position: fixed;
  left: 12px;
  bottom: 12px;
  z-index: 999999;
  pointer-events: auto;
}
.report-bugs a{
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: rgba(15,21,40,.85);
  border: 1px solid rgba(33,43,75,.95);
  box-shadow: 0 10px 26px rgba(0,0,0,.45);
  color: var(--accent);
  text-decoration: none;
  line-height: 1;
}
.report-bugs a:hover{ transform: translateY(-1px); box-shadow: 0 14px 30px rgba(0,0,0,.55); }
.report-bugs a:active{ transform: translateY(0); }

.report-bugs a{ position: relative; }
.report-bugs a::after{
  content: attr(data-tooltip);
  position: absolute;
  left: calc(100% + 10px);
  top: 50%;
  transform: translateY(-50%);
  white-space: nowrap;
  font-size: 11px;
  letter-spacing: .2px;
  padding: 6px 8px;
  border-radius: 10px;
  background: rgba(15,21,40,.95);
  border: 1px solid rgba(33,43,75,.95);
  color: #e9f1f7;
  box-shadow: 0 12px 28px rgba(0,0,0,.55);
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s ease, transform .15s ease;
}
.report-bugs a::before{
  content: "";
  position: absolute;
  left: calc(100% + 4px);
  top: 50%;
  transform: translateY(-50%);
  border: 6px solid transparent;
  border-right-color: rgba(33,43,75,.95);
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s ease;
}
.report-bugs a:hover::after,
.report-bugs a:focus-visible::after{
  opacity: 1;
  transform: translateY(-50%) translateX(2px);
}
.report-bugs a:hover::before,
.report-bugs a:focus-visible::before{ opacity: 1; }

.bug-icon{ width: 18px; height: 18px; display: block; fill: currentColor; }

.report-bugs a.is-pulsing {
  animation: rbPulse 900ms ease-in-out 0s 4 alternate;
  box-shadow: 0 12px 30px rgba(76,194,255,.55);
}
@keyframes rbPulse {
  0%   { transform: translateY(0) scale(1); }
  100% { transform: translateY(-1px) scale(1.06); }
}

.report-bubble { position: fixed; left: 58px; bottom: 18px; z-index: 1000000; padding: 10px 12px; border-radius: 12px; background: rgba(15,21,40,.98); border: 1px solid rgba(33,43,75,.95); color: #e9f1f7; font-size: 12px; letter-spacing: .2px; box-shadow: 0 14px 36px rgba(0,0,0,.55); opacity: 0; transform: translateY(6px); transition: opacity .18s ease, transform .18s ease; max-width: 260px; pointer-events: none; }

.download-app{
  position: fixed;
  left: 12px;
  bottom: 58px;
  z-index: 999999;
  pointer-events: auto;
}

.download-app a{
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  line-height: 1;
  text-decoration: none;
  color: #8fd3ff;
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.20), transparent 38%),
    linear-gradient(180deg, rgba(15,21,40,.92), rgba(10,16,34,.96));
  border: 1px solid rgba(78,136,255,.34);
  box-shadow:
    0 10px 26px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.08),
    0 0 0 1px rgba(58,167,255,.08);
  position: relative;
}

.download-app a:hover{
  transform: translateY(-1px);
  box-shadow:
    0 14px 30px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.10),
    0 0 20px rgba(58,167,255,.18);
}

.download-app a:active{
  transform: translateY(0);
}

.download-app a::after{
  content: attr(data-tooltip);
  position: absolute;
  left: calc(100% + 10px);
  top: 50%;
  transform: translateY(-50%);
  white-space: nowrap;
  font-size: 11px;
  letter-spacing: .2px;
  padding: 6px 8px;
  border-radius: 10px;
  background: rgba(15,21,40,.95);
  border: 1px solid rgba(33,43,75,.95);
  color: #e9f1f7;
  box-shadow: 0 12px 28px rgba(0,0,0,.55);
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s ease, transform .15s ease;
}

.download-app a::before{
  content: "";
  position: absolute;
  left: calc(100% + 4px);
  top: 50%;
  transform: translateY(-50%);
  border: 6px solid transparent;
  border-right-color: rgba(33,43,75,.95);
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s ease;
}

.download-app a:hover::after,
.download-app a:focus-visible::after{
  opacity: 1;
  transform: translateY(-50%) translateX(2px);
}

.download-app a:hover::before,
.download-app a:focus-visible::before{
  opacity: 1;
}

.download-icon{
  width: 18px;
  height: 18px;
  display: block;
  fill: currentColor;
}

.download-app a.is-pulsing{
  animation: rbPulse 900ms ease-in-out 0s 3 alternate;
  box-shadow:
    0 12px 30px rgba(58,167,255,.38),
    inset 0 1px 0 rgba(255,255,255,.10),
    0 0 24px rgba(58,167,255,.20);
}

.download-bubble{
  position: fixed;
  left: 58px;
  bottom: 62px;
  z-index: 1000000;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;

  max-width: 430px;
  padding: 12px 14px;
  border-radius: 16px;
  color: #eaf4ff;

    radial-gradient(circle at top left, rgba(87,163,255,.18), transparent 42%),

  box-shadow:
    0 18px 42px rgba(0,0,0,.48),
    inset 0 1px 0 rgba(255,255,255,.08),

  transform: translateY(8px) scale(.985);
  pointer-events: none;
  transition: opacity .22s ease, transform .22s ease;
}

.download-bubble::before{
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(125,247,200,.18), rgba(58,167,255,.24), rgba(255,255,255,.06));

.download-bubble.is-show{

.download-bubble-icon{

/* =============================================================== */
/* EFFECTS.CSS */
/* =============================================================== */
:root{
  --w11-bg0:#05081b;
  --w11-bg1:#070b22;


  --gX: 0vw;
  --gY: 0vh;
  --gS: 1.02;
  --gO: 0;
  --hO: 0;
}

body{
  background:
    radial-gradient(1200px 700px at 50% 10%, rgba(255,255,255,.06), transparent 55%),
    linear-gradient(180deg, var(--w11-bg0) 0%, var(--w11-bg1) 65%, var(--w11-bg0) 100%) !important;
  background-attachment: fixed;
  overflow-x: hidden;
}

body::before{
  content:"";
  position: fixed;
  inset: -18%;
  pointer-events:none;
  z-index: -1;


  background:
    radial-gradient(520px 420px at 30% 34%, rgba(64,154,255,.75), transparent 62%),
    radial-gradient(620px 520px at 58% 46%, rgba(20,105,255,.55), transparent 64%),
    radial-gradient(780px 600px at 48% 62%, rgba(140,210,255,.35), transparent 68%),
    radial-gradient(900px 700px at 52% 44%, rgba(15,70,210,.22), transparent 70%);

  filter: blur(34px) saturate(128%);
  mix-blend-mode: screen;

  opacity: var(--gO);
  transform: translate3d(var(--gX), var(--gY), 0) scale(var(--gS));
  transform-origin: 50% 50%;


  transition:
    opacity 3.6s ease,
    transform 11s cubic-bezier(.22, .9, .18, 1),
    filter 7s ease;


  animation: w11Breath 9.5s ease-in-out infinite;
}

body::after{
  content:"";
  position: fixed;
  inset: -12%;
  pointer-events:none;
  z-index: -1;

  background:
    radial-gradient(1000px 780px at 48% 40%, rgba(80, 170, 255, .18), transparent 68%),
    radial-gradient(900px 740px at 56% 52%, rgba(35, 120, 255, .12), transparent 70%);

  filter: blur(18px);
  opacity: var(--hO);
  transform: translate3d(calc(var(--gX) * .55), calc(var(--gY) * .55), 0) scale(calc(var(--gS) * 1.01));

  transition:
    opacity 4.4s ease,
    transform 13s cubic-bezier(.22, .9, .18, 1);

  animation: w11Breath2 12.5s ease-in-out infinite;
}

@keyframes w11Breath{
  0%,100%{ filter: blur(34px) saturate(126%); }
  50%    { filter: blur(38px) saturate(132%); }
}
@keyframes w11Breath2{
  0%,100%{ filter: blur(18px); }
  50%    { filter: blur(20px); }
}

@media (prefers-reduced-motion: reduce){
  body::before, body::after{
    animation: none !important;
    transition: none !important;
    opacity: .75;
    transform: none !important;
  }
}

// Escapa HTML (para manter render via innerHTML sem risco)
function escapeHtml(s){
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')

// Extrai cidade após o último traço (-, –, —); se houver '/', ignora o sufixo.
    function extractCity(raw) {
  if (!raw) return '';
  const dashes = ['-', '–', '—'];
  let part = String(raw);
  let lastIdx = -1; let dashLen = 0;
  for (const d of dashes) {
    const i = part.lastIndexOf(d);
    if (i > lastIdx) { lastIdx = i; dashLen = d.length; }
  }
  if (lastIdx !== -1) part = part.slice(lastIdx + dashLen);
  const slashIdx = part.indexOf('/');
  if (slashIdx !== -1) part = part.slice(0, slashIdx);
  // Remove pontuação apenas nas pontas (compatível): mantém letras com acentos latinos, números e espaços.
  part = part
    .replace(/^[^0-9A-Za-zÀ-ÿ]+/g, '')
    .replace(/[^0-9A-Za-zÀ-ÿ\s]+$/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  part = part.replace(/[<>]/g, '');

}

// Distância de Levenshtein (para sugestões)
    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      if (!m) return n; if (!n) return m;
      const dp = Array.from({length: m + 1}, () => Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i-1] === b[j-1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i-1][j] + 1,
            dp[i][j-1] + 1,
            dp[i-1][j-1] + cost
          );
        }
      }
      return dp[m][n];
    }

function iaTokenize(raw){

  const out = [];

    let w = parts[i];
    if(!w) continue;
    if (IA_TOK_MAP[w]) w = IA_TOK_MAP[w];
    if (!w || IA_STOPWORDS.has(w)) continue;

function iaTokenAlignScore(qTokens, cityTokens){
  let pos=0, score=0, ok=0;
  for(const qt of qTokens){
    let found=-1;

function rankSuggestions(inputRaw, limit=3){

  if (RANK_MEMO.has(memoKey)) return RANK_MEMO.get(memoKey);

    const name = IA_ALL[i];
    const n = IA_ALL_N[i];

    else if(n.includes(qNorm) && qNorm.length >= 5) score += 2;

  const best = scored[0];
  const second = scored[1];

  const gap = (best && second) ? (best.score - second.score) : 999;
  const obviousByDist = (best && best.d <= 1 && qNorm.length >= 6);
  const fullCover = (best && qTokens.length >= 2 && best.ok === qTokens.length);

  const obviousByTokens = fullCover || manyTokens;
  const obviousGap = fullCover ? (gap >= 6) : (gap >= 10);
  const single = (obviousByDist || obviousByTokens) && obviousGap;

  const picks=[];
  const seen=new Set();
  for(const it of scored){
    if(picks.length >= (single ? 1 : limit)) break;
    const k = normalize(it.name);
    if(seen.has(k)) continue;
    seen.add(k);
    picks.push(it.name);
  }

    const out = { picks, best, second };
  RANK_MEMO.set(memoKey, out);
  return out;
}

      const cat = sugestaoCategoria(sText);
      b.className = 'sug-pill ' + cat;
      b.type = 'button';
      b.textContent = sText;
      b.setAttribute('aria-label', `Usar sugestão ${sText}`);
      b.addEventListener('click', () => { rememberAlias(termOriginal, normalize(sText)); q.value = sText; buscar(); });
      actions.appendChild(b);
    });
    outSug.appendChild(sug);
    openSuggestWrap(outSug);
  }
}

  <script>
/* =============================================================== */
/* ASSETS/JS/SEARCH-ACTIONS.JS */
/* =============================================================== */
// ====== BUSCA / AÇÕES ======

function buscar() {
  try {
    const raw = q.value || '';
    if (!raw.trim()) {
      const outSug = ensureOutSuggest();
      if (outSug) { closeSuggestWrap(outSug); outSug.innerHTML = ''; outSug.style.height = '0px'; }
      out.innerHTML = '<div class=\"hint\">Cole ou digite um texto contendo a cidade.</div>';
      return;
    }

    clearHighlights();

    const cidadeBruta = extractCity(raw);
    const keyRaw = normalize(cidadeBruta);
    let key = keyRaw;
    let aliasCanonico = null;
    const inAna = setAna.has(keyRaw);
    const inBra = setBra.has(keyRaw);
    const inCob = setCob.has(keyRaw);

    const listasEncontradas = [];
    if (inAna) listasEncontradas.push('ana');
    if (inBra) listasEncontradas.push('bra');
    if (inCob) listasEncontradas.push('nossa');

    if (listasEncontradas.length >= 2) {
      highlightCityByKey(keyRaw);
      mostrarResultado(raw, cidadeBruta, 'dup', [], null, listasEncontradas);
return;
    }

    if (inAna) { highlightCityByKey(keyRaw); mostrarResultado(raw, cidadeBruta, 'ana', [], null); return; }
    if (inBra) { highlightCityByKey(keyRaw); mostrarResultado(raw, cidadeBruta, 'bra', [], null); return; }
    if (inCob) { highlightCityByKey(keyRaw); mostrarResultado(raw, cidadeBruta, 'nossa', [], null); return; }

const aliasPick = getDynamicAliasSuggestion(raw, cidadeBruta);

const ranked = rankSuggestions(cidadeBruta, 3);
let sugs = ranked.picks;

if (aliasPick){
  sugs = [aliasPick, ...sugs.filter(s => normalize(s) !== normalize(aliasPick))].slice(0, 3);
}

mostrarResultado(raw, cidadeBruta, 'nao', sugs, null);  } catch (err) {
    console.error('Erro no buscar():', err);
    try {
      const outSug = ensureOutSuggest();
      if (outSug) { closeSuggestWrap(outSug); outSug.innerHTML = '';  }
      if (out) out.innerHTML = "<div class=\"hint\">\u26a0 Ocorreu um erro ao processar o texto. Tente novamente.</div>";
    } catch (_) {}
  }
}


// ====== ACESSIBILIDADE / ATALHOS ======
    document.addEventListener('keydown', (e)=>{
      if (e.altKey && e.key === 'Enter') {
        const first = out.querySelector('.sug-actions .sug-pill');
        if (first) { first.click(); }
      }
    });

    
// ====== BUSCA AO DIGITAR (opção 2) ======
// Não exibe "Não localizado" com poucas letras; só busca a partir de 2 caracteres.
const AUTOSEARCH_MIN_CHARS = 2;

q.addEventListener('input', debounce(() => {
  const cidade = extractCity(q.value);
  const v = normalize(cidade);

  // Se apagou tudo, volta ao estado inicial
  if (!v) {
    q.removeAttribute('title');
    clearHighlights();
    const outSug = ensureOutSuggest();
    if (outSug) { closeSuggestWrap(outSug); outSug.innerHTML = ''; outSug.style.height = '0px'; }
    out.innerHTML = '<div class="hint">Cole ou digite um texto contendo a cidade.</div>';
    if (outSug) hardResetSuggestWrap(outSug);
    return;
  }

  // Mantém o title de sugestão (como antes)
  const all = [...anapolis, ...brasilia, ...cobertura];
  const found = all.find(c => normalize(c).startsWith(v));
  if (found && cidade.length > 1) {
    q.title = `Sugestão: ${found}`;
  } else {
    q.removeAttribute('title');
  }

  // Opção 2: só começa a avaliar após 2 letras
  if (v.length < AUTOSEARCH_MIN_CHARS) {
    clearHighlights();
    const outSug = ensureOutSuggest();
    if (outSug) { closeSuggestWrap(outSug); outSug.innerHTML = '';  }
    out.innerHTML = '<div class="hint">Digite pelo menos ' + AUTOSEARCH_MIN_CHARS + ' letras da cidade para localizar.</div>';
    return;
  }

  // Busca automática enquanto digita
  buscar();
}, 180));

  </script>

  <script>
/* =============================================================== */
/* ASSETS/JS/CLIPBOARD.JS */
/* =============================================================== */
// =========================
// V8.0.2 — Botão COLAR (da área de transferência)
// =========================
// =========================
// V8.0.3 — FIX: cliques rápidos não bugam o ícone do botão COLAR (📋/✅/⚠)
// =========================
const COPYBTN_DEFAULT_ICON = (copyBtn && String(copyBtn.textContent || '').trim())
  ? String(copyBtn.textContent).trim()
  : '📋';
let copyBtnTimer = null;

function setCopyBtnIcon(icon, { copiedClass = false, duration = 900 } = {}){
  if(!copyBtn) return;
  if(copyBtnTimer){ clearTimeout(copyBtnTimer); copyBtnTimer = null; }
  copyBtn.textContent = icon;
  copyBtn.classList.toggle('is-copied', !!copiedClass);
  copyBtnTimer = setTimeout(() => {
    copyBtn.textContent = COPYBTN_DEFAULT_ICON;
    copyBtn.classList.remove('is-copied');
    copyBtnTimer = null;
  }, duration);
}

function pulsePasted(){
  setCopyBtnIcon('✅', { copiedClass: true, duration: 900 });
}

function pulseWarn(){
  setCopyBtnIcon('⚠', { copiedClass: false, duration: 900 });
}

function pasteFromClipboard(){
  // A API de leitura do clipboard só funciona em contexto seguro (https/localhost) e com gesto do usuário.
  if (!window.isSecureContext || !(navigator.clipboard && navigator.clipboard.readText)) {
    if (q){
      try{ q.focus({preventScroll:true}); }catch(e){ q.focus(); }
      try{ q.select(); }catch(e){}
    }
    try{ copyBtn.title = 'Não foi possível ler a área de transferência aqui. Use Ctrl+V/⌘V no campo.'; }catch(e){}
    pulseWarn();
    return;
  }

  navigator.clipboard.readText()
    .then((txt) => {
      const t = String(txt || '').trim();
      if (!t){
        try{ copyBtn.title = 'Área de transferência vazia.'; }catch(e){}
        pulseWarn();
        return;
      }
      if (q){
        q.value = t;
        try{ q.focus({preventScroll:true}); }catch(e){ q.focus(); }
        try{ q.setSelectionRange(q.value.length, q.value.length); }catch(e){}
      }
      // dispara a busca imediatamente
      try{ buscar(); }catch(e){}
      try{ copyBtn.title = 'Colado!'; }catch(e){}
      pulsePasted();
    })
    .catch(() => {
      if (q){
        try{ q.focus({preventScroll:true}); }catch(e){ q.focus(); }
        try{ q.select(); }catch(e){}
      }
      try{ copyBtn.title = 'Permissão negada. Cole manualmente com Ctrl+V/⌘V.'; }catch(e){}
      pulseWarn();
    });
}
// Botão colar (fica dentro do campo)
if (copyBtn){
  copyBtn.addEventListener('click', pasteFromClipboard);
}

  </script>

// =========================
// THEME_TOGGLE_V1 — Alternância de tema (Light/Dark)
// - Escuro é padrão

// - Respeita prefers-color-scheme quando não há preferência salva
// =========================
(function(){
  const BTN = document.getElementById('themeBtn');
  if(!BTN) return;

  const KEY = 'theme_pref_v1';
  const root = document.documentElement;

  const ICON_SUN = '<path fill="currentColor" d="M12 15q1.25 0 2.125-.875T15 12t-.875-2.125T12 9t-2.125.875T9 12t.875 2.125T12 15m0 1q-1.671 0-2.835-1.164Q8 13.67 8 12t1.165-2.835T12 8t2.836 1.165T16 12t-1.164 2.836T12 16m-7-3.5H1.5v-1H5zm17.5 0H19v-1h3.5zM11.5 5V1.5h1V5zm0 17.5V19h1v3.5zM6.746 7.404l-2.16-2.098l.695-.745l2.111 2.135zM18.72 19.439l-2.117-2.141l.652-.702l2.16 2.098zM16.596 6.745l2.098-2.16l.745.695l-2.135 2.111zM4.562 18.72l2.14-2.117l.664.652l-2.08 2.179zM12 12"/>';
  const ICON_MOON = '<path fill="currentColor" d="M12 21q-3.75 0-6.375-2.625T3 12t2.625-6.375T12 3q.35 0 .688.025t.662.075q-1.025.725-1.638 1.888T11.1 7.5q0 2.25 1.575 3.825T16.5 12.9q1.375 0 2.525-.613T20.9 10.65q.05.325.075.662T21 12q0 3.75-2.625 6.375T12 21"/>';

  function getSystemTheme(){
    try{
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }catch(e){ return 'dark'; }
  }

  function setMetaThemeColor(theme){
    try{
      const meta = document.querySelector('meta[name="theme-color"]');
      if(!meta) return;
      meta.setAttribute('content', theme === 'light' ? '#f3f6fb' : '#0b1020');
    }catch(e){}
  }

  function renderBtn(theme){
    const svg = BTN.querySelector('svg');
    if(svg){
      svg.innerHTML = (theme === 'light') ? ICON_MOON : ICON_SUN;
    }
    const tip = (theme === 'light') ? 'Alternar para tema escuro' : 'Alternar para tema claro';
    BTN.setAttribute('data-tooltip', tip);
    BTN.setAttribute('aria-label', tip);
  }

  function apply(theme, persist=false){
    const t = (theme === 'light') ? 'light' : 'dark';
    if(t === 'light') root.setAttribute('data-theme','light');
    else root.removeAttribute('data-theme');
    renderBtn(t);
    setMetaThemeColor(t);
    if(persist){
      try{ localStorage.setItem(KEY, t); }catch(e){}
    }
  }

  let saved=null;
  try{ saved = localStorage.getItem(KEY); }catch(e){}
  const initial = (saved === 'light' || saved === 'dark') ? saved : getSystemTheme();
  apply(initial, false);

  BTN.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = (current === 'light') ? 'dark' : 'light';
    apply(next, true);
});
})();

(function(){
  try{
  var isLite = document.documentElement && document.documentElement.classList && document.documentElement.classList.contains('perf-lite');
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var root = document.documentElement;
    var anchors = [
      [-18, -12], [18, -12],
      [-18,  14], [18,  14],
      [-22,   2], [22,   2],
      [  0, -14], [ 0,  16]
    ];

    function rand(min, max){ return Math.random() * (max - min) + min; }

    function pickAnchor(prevIdx){
      var idx;
      do { idx = Math.floor(Math.random() * anchors.length); }
      while (idx === prevIdx);
      var a = anchors[idx];
      var x = a[0] + rand(-3.2, 3.2);
      var y = a[1] + rand(-2.2, 2.2);
      var s = rand(0.98, 1.08);
      return { idx: idx, x: x, y: y, s: s };
    }

    function setVars(x, y, s, glow, halo){
    if(isLite){ glow = Math.min(glow, 0.65); halo = Math.min(halo, 0.55); }
      root.style.setProperty('--gX', x.toFixed(2) + 'vw');
      root.style.setProperty('--gY', y.toFixed(2) + 'vh');
      root.style.setProperty('--gS', s.toFixed(3));
      root.style.setProperty('--gO', glow.toFixed(3));
      root.style.setProperty('--hO', halo.toFixed(3));
    }
    setVars(0, 18, 0.98, 0.0, 0.0);

    var prev = -1;

    function cycle(){
      var spot = pickAnchor(prev);
      prev = spot.idx;
      setVars(spot.x, spot.y, spot.s, 0.0, 0.0);
setTimeout(function(){ 
  setVars(spot.x, spot.y, spot.s, 0.82, 0.68); 
}, 280); 
var onTime = isLite ? rand(7600, 10800) : rand(6200, 9000); 
setTimeout(function(){ 
  setVars(spot.x, spot.y, spot.s, 0.0, 0.0); 
}, 280 + onTime); 
var offTime = isLite ? rand(2600, 3800) : rand(2200, 3200); 
setTimeout(cycle, 280 + onTime + 4200 + offTime);
    }
    setTimeout(cycle, 520);

  } catch(e){}
})();
